# Base44 dev environment for SLATE.
# Vite + React + TypeScript SPA — runs entirely in the browser, no backend.
services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:5173"
    command: sh -c "npm install && npx vite --host 0.0.0.0 --port 5173"
    environment:
      # Vite 5 has no allowedHosts feature; host: true via --host is enough.
      - CHOKIDAR_USEPOLLING=true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  node_modules:
