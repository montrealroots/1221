services:
  web:
    image: node:22-bookworm-slim
    working_dir: /app
    env_file:
      - /run/base44/app.env
    environment:
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:5173"
    command: sh -c "npm install && npx vite --host 0.0.0.0 --port 5173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  node_modules:
