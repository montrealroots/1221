# Base44 development environment for SLATE.
# SLATE is a frontend-only Vite + React app — the whole simulation runs in
# the browser and saves go to localStorage. No backend or database is needed.
#
# Bring it up:
#   docker compose -f docker-compose.base44.yml up -d --build
#
# The app is served on host port 3000 (mapped to Vite's default 5173).

services:
  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:5173"
    environment:
      # Vite >= 6.1 appends this to its allowed hosts; harmless on older Vite.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: sh -c "npm install && npx vite --host 0.0.0.0 --port 5173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
