services:
  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:5173"
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r=>{if(!r.ok)throw new Error('bad status')}).catch(e=>{throw e})"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  node_modules:
