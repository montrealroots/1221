# Base44 dev environment for SLATE.
# Vite + React + TypeScript SPA. Runs entirely in the browser; no backend.
services:
  web:
    image: node:22
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./:/app
    ports:
      - "3000:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX:-}
